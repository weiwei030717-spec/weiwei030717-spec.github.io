<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Minecraft Web Toolkit</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nbt@0.10.1/nbt.js"></script>
  
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: #2b2b2b; color: white; }
    .nav-bar { display: flex; gap: 15px; padding: 20px; background: #1e1e1e; border-bottom: 2px solid #3c3c3c; }
    .tab-btn { padding: 10px 25px; font-size: 16px; cursor: pointer; background: #3c3c3c; border: 2px solid transparent; color: white; border-radius: 4px; transition: 0.2s; }
    .tab-btn:hover { background: #555; }
    .tab-btn.active { border-color: #4CAF50; background: #2e4d30; }
    .content-area { padding: 30px; padding-bottom: 90px; }
    .panel { display: none; }
    .panel.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .upload-box { border: 2px dashed #666; border-radius: 8px; padding: 60px; text-align: center; background: #333; transition: 0.2s; }
    .upload-box:hover { border-color: #4CAF50; }
    #editForm { display: none; margin-top: 20px; padding: 25px; background: #1e1e1e; border-radius: 8px; border-left: 4px solid #4CAF50; }
    .form-group { margin-bottom: 20px; display: flex; align-items: center; gap: 15px; }
    .form-group label { font-size: 16px; min-width: 100px; }
    .form-control { padding: 8px 12px; font-size: 16px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; }
    .export-btn { padding: 12px 24px; font-size: 18px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .export-btn:hover { background: #45a049; }
    .music-player { position: fixed; bottom: 0; width: 100%; background: #111; padding: 15px 30px; display: flex; align-items: center; border-top: 3px solid #4CAF50; box-sizing: border-box; z-index: 1000; }
  </style>
</head>
<body>

  <div class="nav-bar">
    <button class="tab-btn active" onclick="switchTab('editor', this)">Level.dat 編輯器</button>
    <button class="tab-btn" onclick="switchTab('maps', this)">特別地圖區</button>
  </div>

  <div class="content-area">
    <div id="editor" class="panel active">
      <h2>Level.dat 檔案編輯</h2>
      
      <div class="upload-box" id="uploadArea">
        <h3 style="margin-top: 0;">點擊或拖曳選擇 level.dat 檔案</h3>
        <input type="file" id="fileInput" accept=".dat" />
        <p id="statusMsg" style="color: #aaa; margin-top: 15px;">等待讀取檔案...</p>
      </div>

      <div id="editForm">
        <h3 style="margin-top: 0; margin-bottom: 20px;">世界設定控制面板</h3>
        <div class="form-group">
          <label for="gameType">遊戲模式：</label>
          <select id="gameType" class="form-control">
            <option value="0">生存模式 (Survival)</option>
            <option value="1">創造模式 (Creative)</option>
            <option value="2">冒險模式 (Adventure)</option>
            <option value="3">旁觀者模式 (Spectator)</option>
          </select>
        </div>
        <div class="form-group">
          <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
            <input type="checkbox" id="allowCommands" style="width: 20px; height: 20px;">
            <span>允許作弊 (Allow Cheats)</span>
          </label>
        </div>
        <div class="form-group">
          <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
            <input type="checkbox" id="hardcore" style="width: 20px; height: 20px;">
            <span style="color: #ff6b6b; font-weight: bold;">極限模式 (Hardcore)</span>
          </label>
        </div>
        <div style="margin-top: 30px;">
          <button class="export-btn" onclick="exportDatFile()">💾 儲存並匯出修改後的 level.dat</button>
        </div>
      </div>
    </div>

    <div id="maps" class="panel">
      <h2>特別地圖展示庫</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
        <div style="background: #3c3c3c; padding: 20px; border-radius: 8px;">
          <h3>跑酷地圖：天空之城</h3>
          <p>這裡可以放截圖與介紹</p>
          <button style="padding: 8px 15px;">下載地圖</button>
        </div>
      </div>
    </div>
  </div>

  <div class="music-player">
    <div style="margin-right: 20px; font-weight: bold;">🎵 唱片機</div>
    <audio controls><source src="music.mp3" type="audio/mpeg"></audio>
  </div>

  <script>
    function switchTab(tabId, btnElement) {
      document.querySelectorAll('.panel').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btnElement.classList.add('active');
    }

    let currentNbtData = null;
    const fileInput = document.getElementById('fileInput');
    const statusMsg = document.getElementById('statusMsg');
    const editForm = document.getElementById('editForm');
    const uploadArea = document.getElementById('uploadArea');

    fileInput.addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (!file) return;

      statusMsg.style.color = "white";
      statusMsg.innerText = "正在解壓縮與解析中...";
      uploadArea.style.padding = "60px";
      editForm.style.display = "none";

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const uint8Array = new Uint8Array(e.target.result);
          let decompressedData;
          
          try {
            decompressedData = pako.inflate(uint8Array);
          } catch (pakoErr) {
            throw new Error("解壓縮失敗 (這可能不是 Java 版的 level.dat 或未經壓縮)。");
          }

          const buffer = decompressedData.buffer.slice(decompressedData.byteOffset, decompressedData.byteOffset + decompressedData.byteLength);

          // 確認 nbt 是否成功載入
          if (typeof nbt === 'undefined') {
            throw new Error("nbt 解析工具未載入，請確認有連接網路或嘗試重新整理頁面。");
          }

          nbt.parseUncompressed(buffer, function(error, data) {
            if (error) {
              statusMsg.innerText = "❌ NBT 解析失敗：" + error.message;
              statusMsg.style.color = "#ff6b6b";
              console.error(error);
              return;
            }
            
            currentNbtData = data;
            const levelData = data.value.Data.value;
            
            if(levelData.GameType) document.getElementById('gameType').value = levelData.GameType.value;
            if(levelData.allowCommands) document.getElementById('allowCommands').checked = (levelData.allowCommands.value === 1);
            if(levelData.hardcore) document.getElementById('hardcore').checked = (levelData.hardcore.value === 1);

            statusMsg.innerText = "✅ 解析成功！請在下方進行修改。";
            statusMsg.style.color = "#4CAF50";
            uploadArea.style.padding = "20px";
            editForm.style.display = "block";
          });

        } catch (err) {
          statusMsg.innerText = "❌ " + err.message;
          statusMsg.style.color = "#ff6b6b";
          console.error("系統錯誤:", err);
        }
      };
      reader.readAsArrayBuffer(file);
    });

    function exportDatFile() {
      if (!currentNbtData) { alert("請先上傳檔案！"); return; }
      
      const levelData = currentNbtData.value.Data.value;
      if(levelData.GameType) levelData.GameType.value = parseInt(document.getElementById('gameType').value, 10);
      if(levelData.allowCommands) levelData.allowCommands.value = document.getElementById('allowCommands').checked ? 1 : 0;
      if(levelData.hardcore) levelData.hardcore.value = document.getElementById('hardcore').checked ? 1 : 0;

      try {
        const uncompressedBuffer = nbt.writeUncompressed(currentNbtData);
        const compressedData = pako.gzip(uncompressedBuffer);
        const blob = new Blob([compressedData], { type: "application/gzip" });
        const url = URL.createObjectURL(blob);
        const downloadLink = document.createElement('a');
        downloadLink.href = url;
        downloadLink.download = "level.dat"; 
        document.body.appendChild(downloadLink);
        downloadLink.click();
        
        setTimeout(() => { document.body.removeChild(downloadLink); URL.revokeObjectURL(url); }, 100);
        alert("✅ 修改成功！已經匯出新的 level.dat。");
      } catch (err) {
        alert("匯出錯誤，請查看 Console。");
        console.error(err);
      }
    }
  </script>
</body>
</html>
